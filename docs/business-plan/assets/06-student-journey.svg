    <rect x="50" y="70" width="1300" height="490" fill="#fff" stroke="#000" stroke-width="3"/>
    <line x1="50" y1="125" x2="1350" y2="125" stroke="#000" stroke-width="1.5"/>
    <line x1="50" y1="175" x2="1350" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="50" y1="250" x2="1350" y2="250" stroke="#000" stroke-width="1.5"/>
    <line x1="50" y1="350" x2="1350" y2="350" stroke="#000" stroke-width="1.5"/>
    <line x1="50" y1="465" x2="1350" y2="465" stroke="#000" stroke-width="1.5"/>
    <line x1="190" y1="125" x2="190" y2="560" stroke="#000" stroke-width="1.5"/>
    <line x1="422" y1="125" x2="422" y2="465" stroke="#000" stroke-width="1.5"/>
    <line x1="654" y1="125" x2="654" y2="465" stroke="#000" stroke-width="1.5"/>
    <line x1="886" y1="125" x2="886" y2="465" stroke="#000" stroke-width="1.5"/>
    <line x1="1118" y1="125" x2="1118" y2="465" stroke="#000" stroke-width="1.5"/>
    <text x="700" y="105" text-anchor="middle" font-size="21" font-weight="700">바트 체첵 · 22세 · 몽골 · D-2 · 충북 소재 대학 재학</text>
    <g text-anchor="middle" font-size="19" font-weight="700">
      <text x="120" y="157">구분</text><text x="306" y="157">1. 대상 확인</text><text x="538" y="157">2. 기준 안내</text><text x="770" y="157">3. 서류 이해</text><text x="1002" y="157">4. 서류 준비</text><text x="1234" y="157">5. 장기 준비</text>
    </g>
    <g text-anchor="middle" font-size="18">
      <text x="120" y="218" font-weight="700">사용자 행동</text>
      <text x="306" y="207">학적·TOPIK·허가</text><text x="306" y="233">필요성 확인</text>
      <text x="538" y="207">허용시간·제한업종</text><text x="538" y="233">기준 확인</text>
      <text x="770" y="207">고지서 항목과</text><text x="770" y="233">기한·금액 확인</text>
      <text x="1002" y="207">신청서 작성 후</text><text x="1002" y="233">학교 제출</text>
      <text x="1234" y="207">졸업 후 F-2-R</text><text x="1234" y="233">요건 사전 점검</text>
      <text x="120" y="306" font-weight="700">비자부기 지원</text>
      <text x="306" y="286">질문형 온보딩으로</text><text x="306" y="314">현재 상황 구분</text><text x="306" y="342">확인할 기준 제시</text>
      <text x="538" y="286">공식 기준을 쉬운</text><text x="538" y="314">한국어로 설명</text><text x="538" y="342">출처·검증일 표시</text>
      <text x="770" y="286">OCR 결과를 항목별</text><text x="770" y="314">확인 필요·누락으로</text><text x="770" y="342">구분해 재검토 지원</text>
      <text x="1002" y="286">서류 체크리스트와</text><text x="1002" y="314">확정 일정만</text><text x="1002" y="342">캘린더에 관리</text>
      <text x="1234" y="286">취업·정착 준비를</text><text x="1234" y="314">후속 여정으로</text><text x="1234" y="342">연결해 안내</text>
      <text x="120" y="414" font-weight="700">판정·제출 주체</text>
      <text x="306" y="395">사용자 확인</text><text x="306" y="423">필요 시 학교 문의</text>
      <text x="538" y="395">비자부기 안내</text><text x="538" y="423">공식 기준 병기</text>
      <text x="770" y="395">사용자 최종 확인</text><text x="770" y="423">자동 판정 금지</text>
      <text x="1002" y="395">대학 국제교류부서</text><text x="1002" y="423">또는 출입국기관</text>
      <text x="1234" y="395">관할 행정기관의</text><text x="1234" y="423">최종 판단</text>
    </g>
    <text x="120" y="516" text-anchor="middle" font-size="18" font-weight="700">핵심 가치</text>
    <text x="770" y="516" text-anchor="middle" font-size="19">학업·취업 허가와 졸업 후 정착 준비를 하나의 연속된 여정으로 관리</text>
  </g>
