      <text x="416" y="365">설계·검수 확정</text><text x="416" y="393"></text>
      <text x="789" y="365">구현 완료</text><text x="789" y="393"></text>
      <text x="1163" y="365">구현 예정</text><text x="1163" y="393"></text>
    </g>
    <text x="140" y="468" text-anchor="middle" font-size="18" font-weight="700">2차 발표평가</text>
    <text x="790" y="468" text-anchor="middle" font-size="19">이주노동자 × E-7-4R 체류자격 트래커를 중심으로 시연</text>
